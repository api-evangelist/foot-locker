aid: foot-locker
name: Foot Locker
description: >-
  Foot Locker, Inc. is a global retailer of athletic footwear and apparel,
  operating the Foot Locker, Kids Foot Locker, Champs Sports, WSS and atmos
  banners across North America, Europe, Asia and Australia. DICK'S Sporting
  Goods completed its acquisition of Foot Locker, Inc. on September 8, 2025
  and continues to operate the Foot Locker brand suite. Foot Locker publishes
  no public developer portal, API reference or machine-readable contract.
  Trading-partner integration runs through third-party host platforms rather
  than a first-party developer site: supplier inventory and dropship through
  CommerceHub Dsco, and the Storefronts creator/affiliate program through
  impact.com, each requiring a commercial agreement. The former
  api.footlocker.com Apigee gateway no longer resolves.
