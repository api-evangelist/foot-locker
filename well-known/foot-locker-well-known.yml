method: probed
source: >-
  Direct HTTPS probes of the RFC 8615 well-known paths on every host this record
  knows — the storefront (www.footlocker.com), the corporate site
  (www.footlocker-inc.com), the careers host (careers.footlocker.com) and the
  investor-relations host (investors.footlocker-inc.com).
note: >-
  NO WELL-KNOWN DOCUMENT IS SERVED. Every named path returned 404 on the
  storefront, the corporate site and the careers host; the investor-relations
  host answered 403 to every path (an Akamai edge policy, not a document).
  Because nothing returned a real document, this repo deliberately carries NO
  `WellKnown` and NO `SecurityTxt` pointer in apis.yml — the probe records an
  absence, and an absence must not be published as a presence.
  The storefront additionally answers HTTP 200 with a React/AEM single-page
  shell for EVERY unrouted path (/openapi.json, /swagger.json, /llms.txt and any
  invented slug all return ~600KB of HTML). Those 200s are soft-404s, not
  documents. The shell's own embedded Redux state exposes the discriminator:
  an unrouted path carries `"unauthored":{"<path>":true}` while a real authored
  page carries `false`. Any probe of footlocker.com that reads status codes
  alone will award this provider credit it has not earned.

